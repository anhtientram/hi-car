workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Hi Car"
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: "com.hicar.ora.limited"
      xcode: latest
      cocoapods: default
    scripts:
      # ... giữ nguyên FVM, pub get, pod install ...
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Flutter build IPA
        script: |
          fvm flutter build ipa --release \
            --export-options-plist=$HOME/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
