plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    // id "com.google.gms.google-services"
    // id "com.google.firebase.crashlytics"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
android {
    namespace "com.hicar.ora.limited"
    compileSdk 36
    // ndkVersion "29.0.13846066"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "17"
    }


    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.hicar.ora.limited"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        ndk {
            // arm64-v8a: thiết bị 64-bit hiện đại (bắt buộc cho Play).
            // armeabi-v7a: nhiều Android Box / màn hình xe đời cũ là 32-bit ARM.
            // (Bỏ x86_64 vì gần như chỉ dùng cho emulator, không cần cho thiết bị thật.)
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    signingConfigs {
       release {
           keyAlias keystoreProperties['keyAlias']
           keyPassword keystoreProperties['keyPassword']
           storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
           storePassword keystoreProperties['storePassword']
        }
    }
    buildTypes {
        release {
            // signingConfig signingConfigs.debug
            signingConfig signingConfigs.release
            // 🟢 Bật R8 để rút gọn code + tài nguyên, giảm dung lượng app.
            //    Các lớp native/plugin/entry-point đã được giữ trong proguard-rules.pro.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "androidx.media:media:1.6.0"
    implementation "androidx.core:core-ktx:1.12.0"
}

def overlayPatchFile = file("${rootProject.projectDir}/overlay_patches/flutter/overlay/window/flutter_overlay_window/OverlayService.java")
def overlayPluginRelPath = "hosted/pub.dev/flutter_overlay_window-0.5.0/android/src/main/java/flutter/overlay/window/flutter_overlay_window"

// Tìm ĐÚNG thư mục plugin trong pub cache trên mọi HĐH (macOS/Linux/Windows/CI).
// Trước đây chỉ hard-code đường Windows nên trên macOS patch không được áp → app biên
// dịch bản plugin gốc (kéo nút ra ngoài màn hình + không đăng ký OverlayBridge).
def resolveOverlayPluginDir = {
    def roots = []
    def pubEnv = System.getenv('PUB_CACHE')
    if (pubEnv != null && !pubEnv.trim().isEmpty()) roots << pubEnv
    def home = System.getProperty('user.home')
    roots << "${home}/.pub-cache"                       // macOS / Linux
    def localAppData = System.getenv('LOCALAPPDATA')
    if (localAppData != null && !localAppData.trim().isEmpty()) roots << "${localAppData}/Pub/Cache"
    def appData = System.getenv('APPDATA')
    if (appData != null && !appData.trim().isEmpty()) roots << "${appData}/Pub/Cache"
    roots << "${home}/AppData/Local/Pub/Cache"          // Windows (dự phòng)
    for (root in roots) {
        def dir = file("${root}/${overlayPluginRelPath}")
        if (dir.exists()) return dir
    }
    return null
}

tasks.register("applyOverlayPatch") {
    doLast {
        if (!overlayPatchFile.exists()) {
            println("HiCar: OverlayService patch not found, skip")
            return
        }
        def targetDir = resolveOverlayPluginDir()
        if (targetDir == null) {
            throw new GradleException(
                "HiCar: không tìm thấy flutter_overlay_window trong pub cache để áp patch OverlayService.java. " +
                "Chạy 'flutter pub get' trước, hoặc đặt biến môi trường PUB_CACHE."
            )
        }
        def dest = new File(targetDir, "OverlayService.java")
        ant.copy(file: overlayPatchFile, tofile: dest, overwrite: true)
        println("HiCar: applied OverlayService patch → ${dest}")
    }
}

tasks.named("preBuild").configure { dependsOn("applyOverlayPatch") }
